# AKS production — Hetzner VPS + Caddy (see docs in HETZNER path / deploy notes)
# Usage on server:
#   cp .env.production.example .env   # then edit secrets
#   docker compose -f docker-compose.prod.yml up -d --build

name: aks

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aks}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-aks}
    volumes:
      - aks_pg_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-aks} -d ${POSTGRES_DB:-aks}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    mem_limit: 384m
    command:
      - postgres
      - -c
      - shared_buffers=64MB
      - -c
      - effective_cache_size=128MB
      - -c
      - max_connections=40

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aks}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aks}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["migrate"]
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aks}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aks}
      AUTH_URL: ${AUTH_URL:-https://www.aks-atelier.com}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://www.aks-atelier.com}
      NODE_ENV: production
      AKS_ALLOW_DEV_OTP: "0"
      R2_ENDPOINT: http://minio:9000
      R2_SERVE_VIA_APP: "1"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    expose:
      - "3000"
    command: ["app"]
    mem_limit: 768m
    healthcheck:
      # TCP-only: next-intl may absolute-rewrite `/` to AUTH_URL (HTTPS), which
      # fails inside the container before DNS/Caddy are correct.
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('net').connect(3000,'127.0.0.1',()=>process.exit(0)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 45s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-aks}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-aks}
      NODE_ENV: production
      OUTBOX_POLL_MS: "500"
      R2_ENDPOINT: http://minio:9000
      R2_SERVE_VIA_APP: "1"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    command: ["worker"]
    mem_limit: 256m

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aksminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-aksminiosecret}
    volumes:
      - aks_minio_data:/data
    expose:
      - "9000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 256m

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-aksminio} $${MINIO_ROOT_PASSWORD:-aksminiosecret} &&
      mc mb -p local/$${R2_BUCKET:-aks-assets} || true &&
      mc anonymous set download local/$${R2_BUCKET:-aks-assets} || true
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-aksminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-aksminiosecret}
      R2_BUCKET: ${R2_BUCKET:-aks-assets}
    restart: "no"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 64m

volumes:
  aks_pg_data:
  aks_minio_data:
  caddy_data:
  caddy_config:
