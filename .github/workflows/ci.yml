name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: typecheck · lint · build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Same build-time placeholders as the Dockerfile: the DB client needs a
      # URL at import time, but no database is reached while building (shop
      # pages render on demand). Secrets stay runtime-only.
      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          DATABASE_URL: postgresql://aks:aks@127.0.0.1:1/aks
          AUTH_SECRET: build-time-placeholder-not-used-at-runtime
          AUTH_URL: https://www.aks-atelier.com
          NEXT_PUBLIC_SITE_URL: https://www.aks-atelier.com
          AI_GENERATION_MOCK: "1"
        run: npm run build

  test:
    name: tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aks
          POSTGRES_PASSWORD: aks
          POSTGRES_DB: aksv2
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aks"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://aks:aks@localhost:5432/aksv2
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      # Single source of truth: Drizzle migrations + schema verification.
      - name: Bootstrap database
        run: npm run db:migrate
      - name: Production preflight (non-strict)
        run: npm run preflight:production
      - name: Test
        run: npm test
